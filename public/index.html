<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --text: #1d2433; --muted: #657088;
    --line: #dfe3ea; --accent: #1f5eff; --accent-text: #ffffff; --danger: #c62828;
    --bar: #1f5eff; --bar2: #0f9d8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161f; --surface: #1b2130; --text: #e8ebf2; --muted: #98a2b8;
      --line: #2b3347; --accent: #5b8cff; --accent-text: #0d1220; --danger: #ff7b7b;
      --bar: #5b8cff; --bar2: #3fd0b8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .brand img { width: 84px; height: 84px; object-fit: contain; flex: none; }
  .brand h1 { margin: 0; }
  .brand p { margin: 2px 0 0; color: var(--muted); }
  .brand .logout { margin-left: auto; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .sub { margin: 0 0 24px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; }
  .stat b { display: block; font-size: 1.6rem; overflow-wrap: anywhere; }
  .stat span { color: var(--muted); font-size: .9rem; }

  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 20px; }
  .charts .panel { margin-bottom: 0; }

  .bar-row { display: grid; grid-template-columns: 90px 1fr 28px; align-items: center; gap: 10px; margin-bottom: 10px; font-size: .92rem; }
  .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 7px; background: var(--bar); transition: width .3s; }
  .bar-fill.alt { background: var(--bar2); }
  .bar-count { text-align: right; color: var(--muted); }

  form { display: flex; gap: 10px; flex-wrap: wrap; }
  input, select { flex: 1 1 180px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { padding: 10px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--danger); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input { flex: 2 1 220px; }
  .toolbar select { flex: 1 1 160px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .9rem; }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions button { padding: 6px 12px; margin-left: 6px; }
  .empty { color: var(--muted); padding: 18px 8px; }
  #msg { min-height: 1.4em; margin: 10px 0 0; color: var(--danger); font-size: .9rem; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img src="/cpsu-logo.png" alt="Central Philippines State University seal" onerror="this.style.display='none'">
    <div>
      <h1>Student Dashboard</h1>
      <p>Central Philippines State University</p>
    </div>
    <button type="button" id="logoutBtn" class="logout">Log out</button>
  </header>
  <p class="sub">Add, edit, and remove students, and see how they are spread across courses and year levels.</p>

  <div class="stats">
    <div class="stat"><b id="statTotal">0</b><span>Total students</span></div>
    <div class="stat"><b id="statCourses">0</b><span>Courses</span></div>
    <div class="stat"><b id="statTop">-</b><span>Most students in</span></div>
  </div>

  <div class="charts">
    <section class="panel">
      <h2>Students per course</h2>
      <div id="courseChart"></div>
    </section>
    <section class="panel">
      <h2>Students per year level</h2>
      <div id="yearChart"></div>
    </section>
  </div>

  <section class="panel">
    <form id="form">
      <input id="name" placeholder="Student name" autocomplete="off" required>
      <input id="course" placeholder="Course (e.g. BSIT)" autocomplete="off" required>
      <select id="year" aria-label="Year level">
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
      </select>
      <button type="submit" class="primary" id="saveBtn">Add student</button>
      <button type="button" id="cancelBtn" hidden>Cancel</button>
    </form>
    <p id="msg" role="alert"></p>
  </section>

  <section class="panel">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search by name or course" aria-label="Search students">
      <select id="courseFilter" aria-label="Filter by course">
        <option value="">All courses</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Year level</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  const YEARS = ['1st Year', '2nd Year', '3rd Year', '4th Year'];
  const form = document.getElementById('form');
  const nameInput = document.getElementById('name');
  const courseInput = document.getElementById('course');
  const yearInput = document.getElementById('year');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const rows = document.getElementById('rows');
  const msg = document.getElementById('msg');
  const search = document.getElementById('search');
  const courseFilter = document.getElementById('courseFilter');

  let students = [];
  let editingId = null;

  async function api(url, options) {
    const res = await fetch(url, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (res.status === 401) { window.location.href = '/login'; throw new Error('Please log in.'); }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  async function loadStudents() {
    students = await api('/api/students');
    renderStats();
    renderCharts();
    renderCourseFilter();
    renderTable();
  }

  function countBy(list, key) {
    const counts = new Map();
    list.forEach(s => {
      const label = key === 'course' ? s.course.toUpperCase() : s[key];
      counts.set(label, (counts.get(label) || 0) + 1);
    });
    return counts;
  }

  function renderStats() {
    const byCourse = countBy(students, 'course');
    document.getElementById('statTotal').textContent = students.length;
    document.getElementById('statCourses').textContent = byCourse.size;

    let top = '-';
    let max = 0;
    byCourse.forEach((count, course) => {
      if (count > max) { max = count; top = course; }
    });
    document.getElementById('statTop').textContent = top;
  }

  function drawBars(container, counts, alt) {
    container.innerHTML = '';
    if (counts.size === 0) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No data yet.';
      container.appendChild(p);
      return;
    }
    const max = Math.max(...counts.values());
    counts.forEach((count, label) => {
      const row = document.createElement('div');
      row.className = 'bar-row';

      const name = document.createElement('span');
      name.className = 'bar-label';
      name.textContent = label;
      name.title = label;

      const track = document.createElement('div');
      track.className = 'bar-track';
      const fill = document.createElement('div');
      fill.className = 'bar-fill' + (alt ? ' alt' : '');
      fill.style.width = (count / max * 100) + '%';
      track.appendChild(fill);

      const num = document.createElement('span');
      num.className = 'bar-count';
      num.textContent = count;

      row.append(name, track, num);
      container.appendChild(row);
    });
  }

  function renderCharts() {
    drawBars(document.getElementById('courseChart'), countBy(students, 'course'), false);

    const byYear = countBy(students, 'year_level');
    const ordered = new Map();
    YEARS.forEach(y => { if (byYear.has(y)) ordered.set(y, byYear.get(y)); });
    drawBars(document.getElementById('yearChart'), ordered, true);
  }

  function renderCourseFilter() {
    const selected = courseFilter.value;
    const courses = [...countBy(students, 'course').keys()].sort();
    courseFilter.innerHTML = '';
    const all = document.createElement('option');
    all.value = '';
    all.textContent = 'All courses';
    courseFilter.appendChild(all);
    courses.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      courseFilter.appendChild(opt);
    });
    courseFilter.value = courses.includes(selected) ? selected : '';
  }

  function renderTable() {
    const term = search.value.trim().toLowerCase();
    const course = courseFilter.value;

    const visible = students.filter(s => {
      const matchesTerm = !term ||
        s.name.toLowerCase().includes(term) ||
        s.course.toLowerCase().includes(term);
      const matchesCourse = !course || s.course.toUpperCase() === course;
      return matchesTerm && matchesCourse;
    });

    rows.innerHTML = '';
    if (visible.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 5;
      td.className = 'empty';
      td.textContent = students.length === 0
        ? 'No students yet. Add the first one above.'
        : 'No students match your search.';
      tr.appendChild(td);
      rows.appendChild(tr);
      return;
    }

    visible.forEach(s => {
      const tr = document.createElement('tr');
      [s.id, s.name, s.course, s.year_level].forEach(value => {
        const td = document.createElement('td');
        td.textContent = value;
        tr.appendChild(td);
      });

      const actions = document.createElement('td');
      actions.className = 'actions';

      const editBtn = document.createElement('button');
      editBtn.textContent = 'Edit';
      editBtn.onclick = () => startEdit(s);

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.className = 'danger';
      delBtn.onclick = () => removeStudent(s);

      actions.append(editBtn, delBtn);
      tr.appendChild(actions);
      rows.appendChild(tr);
    });
  }

  function startEdit(student) {
    editingId = student.id;
    nameInput.value = student.name;
    courseInput.value = student.course;
    yearInput.value = student.year_level;
    saveBtn.textContent = 'Save changes';
    cancelBtn.hidden = false;
    nameInput.focus();
    window.scrollTo({ top: form.offsetTop - 120, behavior: 'smooth' });
  }

  function resetForm() {
    editingId = null;
    form.reset();
    saveBtn.textContent = 'Add student';
    cancelBtn.hidden = true;
  }

  async function removeStudent(student) {
    if (!confirm(`Delete ${student.name}?`)) return;
    try {
      await api(`/api/students/${student.id}`, { method: 'DELETE' });
      if (editingId === student.id) resetForm();
      msg.textContent = '';
      loadStudents();
    } catch (err) {
      msg.textContent = err.message;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    const body = JSON.stringify({
      name: nameInput.value,
      course: courseInput.value,
      year_level: yearInput.value
    });
    try {
      if (editingId) {
        await api(`/api/students/${editingId}`, { method: 'PUT', body });
      } else {
        await api('/api/students', { method: 'POST', body });
      }
      resetForm();
      loadStudents();
    } catch (err) {
      msg.textContent = err.message;
    }
  });

  cancelBtn.addEventListener('click', resetForm);
  search.addEventListener('input', renderTable);
  courseFilter.addEventListener('change', renderTable);

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  });

  loadStudents().catch(err => { msg.textContent = err.message; });
</script>
</body>
</html>
